name: ログイン機構をさくらへ設置

# 初回の設置と、PHP を直したときの再設置に使う。手で押したときだけ動く。
# 生成物（site/ の中身）には触らない。毎朝の配信は news.yml が受け持つ。
on:
  workflow_dispatch:
    inputs:
      site_url:
        description: '設置後に開いて確かめる URL'
        required: false
        default: 'http://news.n-higuchi.jp/'

permissions:
  contents: read

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 秘密が登録されているか確かめる
        env:
          SAKURA_FTP_HOST: ${{ secrets.SAKURA_FTP_HOST }}
          SAKURA_FTP_USER: ${{ secrets.SAKURA_FTP_USER }}
          SAKURA_FTP_PASS: ${{ secrets.SAKURA_FTP_PASS }}
          SAKURA_FTP_PATH: ${{ secrets.SAKURA_FTP_PATH }}
        run: |
          set -euo pipefail
          missing=''
          [ -n "${SAKURA_FTP_HOST:-}" ] || missing="$missing SAKURA_FTP_HOST"
          [ -n "${SAKURA_FTP_USER:-}" ] || missing="$missing SAKURA_FTP_USER"
          [ -n "${SAKURA_FTP_PASS:-}" ] || missing="$missing SAKURA_FTP_PASS"
          [ -n "${SAKURA_FTP_PATH:-}" ] || missing="$missing SAKURA_FTP_PATH"
          if [ -n "$missing" ]; then
            echo "::error::GitHub の Secrets が足りません:$missing"
            exit 1
          fi
          echo "4つとも登録されています。"

      - name: さくらに届くか調べる
        env:
          SAKURA_FTP_HOST: ${{ secrets.SAKURA_FTP_HOST }}
          SITE_URL: ${{ inputs.site_url }}
        run: |
          set -uo pipefail
          echo "### 到達性の確認" >> "$GITHUB_STEP_SUMMARY"

          probe() {  # 名前 ポート
            if timeout 10 bash -c "exec 3<>/dev/tcp/$SAKURA_FTP_HOST/$2" 2>/dev/null; then
              echo "- $1 (ポート $2): 届く" >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi
            echo "- $1 (ポート $2): **届かない**" >> "$GITHUB_STEP_SUMMARY"
            return 1
          }

          probe FTP 21 || true
          probe SSH 22 || true

          # web が見えて FTP が見えないなら、経路ではなくポート単位の遮断。
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 "$SITE_URL" || echo 000)
          echo "- Web (ポート 80): 応答 $code" >> "$GITHUB_STEP_SUMMARY"

          echo "- このランナーの所在: $(curl -sS --max-time 10 https://ipinfo.io/country || echo 不明)" >> "$GITHUB_STEP_SUMMARY"

      - name: PHP の書き方を確かめる
        run: |
          set -euo pipefail
          # 壊れた PHP を本番へ上げない。
          find server/public -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: さくらへ設置する
        env:
          SAKURA_FTP_HOST: ${{ secrets.SAKURA_FTP_HOST }}
          SAKURA_FTP_USER: ${{ secrets.SAKURA_FTP_USER }}
          SAKURA_FTP_PASS: ${{ secrets.SAKURA_FTP_PASS }}
          SAKURA_FTP_PATH: ${{ secrets.SAKURA_FTP_PATH }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          # パスワードを引数に置くと ps から見える。標準入力から渡す。
          umask 077
          script="$RUNNER_TEMP/lftp-install.txt"
          trap 'rm -f "$script"' EXIT

          # --delete は付けない。付けると site/ の中身まで消える。
          # .htaccess のような隠しファイルも mirror は既定で運ぶ。
          cat > "$script" <<LFTP
          debug 3
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 1
          set net:timeout 15
          set net:reconnect-interval-base 5
          open -u "$SAKURA_FTP_USER","$SAKURA_FTP_PASS" "$SAKURA_FTP_HOST"
          mirror --reverse --verbose --parallel=4 --exclude-glob .gitkeep server/public/ "$SAKURA_FTP_PATH/"
          mkdir -p -f "$SAKURA_FTP_PATH/site"
          mkdir -p -f "$SAKURA_FTP_PATH/state"
          chmod 755 "$SAKURA_FTP_PATH/state"
          bye
          LFTP

          # debug を上げたので、万一の取りこぼしに備えて伏字にしてから出す。
          # （GitHub も Secrets を伏字にするが、二重にかけておく。）
          lftp -f "$script" 2>&1 | sed -E 's/(PASS|pass|password)[[:space:]]+.*/\1 [伏字]/'
          echo "設置しました: $SAKURA_FTP_PATH/"

      - name: 外から見て確かめる
        env:
          SITE_URL: ${{ inputs.site_url }}
        run: |
          set -euo pipefail
          [ -n "${SITE_URL:-}" ] || { echo "URL の指定がないので確認を飛ばします。"; exit 0; }

          echo "### 設置後の確認" >> "$GITHUB_STEP_SUMMARY"

          fail=0
          # 入口はログイン画面に落ちること。
          body=$(curl -sS -L --max-time 25 "$SITE_URL" || true)
          if printf '%s' "$body" | grep -q 'Defense Facility Watch'; then
            echo "- ログイン画面が出た: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- :x: ログイン画面が出ない: $SITE_URL" >> "$GITHUB_STEP_SUMMARY"
            fail=1
          fi

          # 設定ファイルは外から読めてはならない。
          for path in lib/config.php lib/users.php state/ site/; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 25 "${SITE_URL%/}/$path" || echo 000)
            case "$code" in
              403|404) echo "- 遮断できている ($code): /$path" >> "$GITHUB_STEP_SUMMARY" ;;
              *)       echo "- :x: 読めてしまう ($code): /$path" >> "$GITHUB_STEP_SUMMARY"; fail=1 ;;
            esac
          done

          [ "$fail" -eq 0 ] || { echo "::error::設置後の確認に失敗しました。上の一覧を見てください。"; exit 1; }
