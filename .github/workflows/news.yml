name: 防衛施設ウォッチ 更新

on:
  # このワークフローはまだ既定ブランチに無いので、Actions画面の手動実行ボタンからは
  # 呼べない（GitHub は既定ブランチにあるワークフローしか dispatch 対象にしない）。
  # 開発中はこのブランチへの push で走らせる。
  #
  # docs/ と data/ を除いているのは、下の「結果をコミット」が押し戻す変更で
  # 自分自身を再実行させないため。
  push:
    branches:
      - claude/personal-news-site-m7eu0k
    paths-ignore:
      - 'docs/**'
      - 'data/**'
  schedule:
    # cron は UTC。日本時間の 07:00 に走らせる。
    - cron: '0 22 * * *'   # JST 07:00（前日UTC）

  # 画面の更新ボタンはこれを叩く。手動実行にも使う。
  # 注意: GitHub は既定ブランチにあるワークフローしか dispatch の対象にしないので、
  # ボタンを効かせるにはこのファイルが既定ブランチに入っている必要がある。
  workflow_dispatch:

# 実行が重なるとアーカイブの書き戻しが衝突するので、1本ずつ流す。
concurrency:
  group: news-update
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    # 配信の要否をステップの if で判断するため、ジョブの env に上げておく
    env:
      SAKURA_FTP_HOST: ${{ secrets.SAKURA_FTP_HOST }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Google ニュースのリンクは JavaScript でしか元記事に飛ばないため、
      # 解決にブラウザが要る。詳しくは news/lib/resolve.mjs のコメント。
      - name: Chromium をキャッシュ
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Chromium を用意
        if: steps.chromium-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # 外部ネットワークを使わない自己テスト。壊れた状態で本番を走らせない。
      - name: 自己テスト
        run: npm run news:test

      - name: 収集・要約・サイト生成
        id: build
        # 情報源が全滅しても、生成済みのページは残したいので後段へ進める。
        # 失敗は最後のステップで拾って赤くする。
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # 「リンクされたアカウント」で作ったキーを使う場合だけ必要。
          # ワークスペースを指定して作ったキーでは空のままでよい。
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        run: npm run news:build

      - name: 結果をコミット
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 生成が途中で落ちた場合でも git add がエラーにならないようにする
          mkdir -p docs data
          git add docs data
          if git diff --staged --quiet; then
            echo "更新なし"
            exit 0
          fi
          # 押せるまで数回試す。
          #
          # rebase では解決できない。docs/ と data/ は毎回まるごと作り直されるため、
          # 取り込もうとすると必ず全ファイルが競合する。すると rebase が途中で
          # 止まったまま次の push が「Everything up-to-date」を返して成功扱いになり、
          # 生成した結果が黙って消える（実際に起きた）。
          # 生成物はこちらの内容が常に正しいので、最新の上に載せ直す。競合は起きない。
          for attempt in 1 2 3 4; do
            git commit -q -m "ニュース更新: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi

            echo "push に失敗（${attempt}回目）。最新を取り込んで載せ直します。"
            git fetch origin "${GITHUB_REF_NAME}"
            # コミットは取り消すが、生成物は index に残る
            git reset --soft "origin/${GITHUB_REF_NAME}"
            git add docs data
            if git diff --staged --quiet; then
              echo "最新と同じ内容でした"
              exit 0
            fi
            sleep $((2 ** attempt))
          done
          echo "::error::結果をブランチに push できませんでした。"
          exit 1

      # さくらインターネットへ配信する。秘密が入っていなければ何もしない。
      # PHP 一式（server/public/）は設定ファイルに鍵が入るので同期しない。
      # 生成物だけを site/ に置く。設置は deploy-server.yml が受け持つ。
      - name: さくらインターネットへ配信
        if: env.SAKURA_FTP_HOST != ''
        env:
          SAKURA_FTP_HOST: ${{ secrets.SAKURA_FTP_HOST }}
          SAKURA_FTP_USER: ${{ secrets.SAKURA_FTP_USER }}
          SAKURA_FTP_PASS: ${{ secrets.SAKURA_FTP_PASS }}
          SAKURA_FTP_PATH: ${{ secrets.SAKURA_FTP_PATH }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

          # パスワードを引数に置くと ps から見える。標準入力から渡す。
          umask 077
          script="$RUNNER_TEMP/lftp-deploy.txt"
          trap 'rm -f "$script"' EXIT

          # 平文 FTP は使わない。TLS を強制し、証明書も検証する。
          cat > "$script" <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 3
          set net:timeout 20
          open -u "$SAKURA_FTP_USER","$SAKURA_FTP_PASS" "$SAKURA_FTP_HOST"
          mirror --reverse --delete --parallel=4 docs/ "$SAKURA_FTP_PATH/site/"
          bye
          LFTP

          lftp -f "$script"
          echo "配信しました: $SAKURA_FTP_PATH/site/"

      - name: GitHub Pages 用に docs/ を渡す
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: 情報源が全滅していたら失敗にする
        if: steps.build.outcome == 'failure'
        run: |
          echo "::error::どの情報源からも記事を取得できませんでした。実行サマリの一覧を確認してください。"
          exit 1

  # Pages の公開元を「GitHub Actions」に設定しているときだけ意味を持つジョブ。
  # 「ブランチの /docs」で公開する設定なら、上の update ジョブのコミットだけで足りる。
  deploy:
    needs: update
    if: always() && needs.update.result != 'cancelled'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages の公開元が「GitHub Actions」でない場合はここが失敗する。
      # サイト自体はブランチにコミット済みなので、その失敗で全体を赤くしない。
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
