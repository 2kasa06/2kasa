name: 投資リサーチ 銘柄一覧の更新と実データ確認

on:
  # 取得の仕組みを変えたときに、このブランチへの push で確認する
  push:
    branches:
      - claude/investment-info-site-l3op44
    paths:
      - 'research/scripts/fetch-jp-stocks.py'
      - 'research/scripts/yahoo-smoke.ts'
      - 'research/src/lib/providers/yahoo/**'
      - '.github/workflows/research-data.yml'
  schedule:
    # 月1回、新規上場・上場廃止を検索に反映する
    - cron: '10 21 1 * *'   # 毎月1日 UTC 21:10（JST 2日 06:10）
  workflow_dispatch:

# 他の更新とは別の枠で走らせる（同じ枠だと、後から来た更新に待ち行列から押し出されて取り消される）。
# コミットするのは自分のファイルだけで、push が衝突したら取り込み直すので重なっても壊れない。
concurrency:
  group: research-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: research/package-lock.json

      - run: npm ci

      - name: 東証上場銘柄一覧を取得
        id: list
        continue-on-error: true
        run: |
          python3 -m pip install --quiet xlrd==2.0.1 openpyxl
          python3 scripts/fetch-jp-stocks.py

      - name: Yahoo から実際に取得できるか確認
        run: npx tsx --tsconfig tsconfig.json scripts/yahoo-smoke.ts

      - name: 銘柄一覧をコミット
        if: steps.list.outcome == 'success'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/jp-stocks.json
          if git diff --staged --quiet; then
            echo "変更なし"
            exit 0
          fi
          for attempt in 1 2 3 4; do
            git commit -q -m "投資リサーチ: 東証上場銘柄一覧を更新"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then exit 0; fi
            git fetch origin "${GITHUB_REF_NAME}"
            git reset -q "origin/${GITHUB_REF_NAME}"
            git add src/data/jp-stocks.json
            if git diff --staged --quiet; then exit 0; fi
            sleep $((2 ** attempt))
          done
          echo "::error::銘柄一覧を push できませんでした"
          exit 1

      - name: 銘柄一覧の取得に失敗していたら知らせる
        if: steps.list.outcome == 'failure'
        run: |
          echo "::error::JPX の上場銘柄一覧を取得できませんでした。URL か形式が変わった可能性があります。"
          exit 1
