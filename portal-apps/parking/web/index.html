<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070E18">
<title>駐車場の空き状況</title>
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="hazard" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <a class="back" href="../../">ポータルへ戻る</a>
    <div class="title">
      <div class="pmark" aria-hidden="true">P</div>
      <div>
        <h1>駐車場の空き状況</h1>
        <div class="sub">本社まわりの社員駐車場。出発前に、空いている場所を。</div>
      </div>
    </div>
    <div class="clock"><b class="num" id="clock">--:--</b><span id="today"></span></div>
  </header>

  <section class="status-row">
    <div class="panel best" id="best" aria-live="polite">
      <div class="label">いま停めやすい駐車場</div>
      <h2>読み込んでいます…</h2>
    </div>
    <div class="panel me" id="me">
      <div class="label">あなたの駐車</div>
      <div class="now">確認しています…</div>
    </div>
  </section>

  <section class="lots" id="lots" aria-label="駐車場の一覧"></section>

  <details class="panel admin" id="admin" hidden>
    <summary>駐車場の設定(管理者のみ)</summary>
    <p class="note">台数は区画の総数です。「固定」は来客用や社用車など、このページで記録しない常時使用の台数です。</p>
    <div class="admin-list" id="adminList"></div>
    <div class="admin-add"><button class="btn small" id="addLot" type="button">＋ 駐車場を追加</button></div>
  </details>

  <p class="note">「ここに停めた」を押すと台数に反映されます。帰るときは「出庫した」を押してください。押し忘れても、記録はその日のうちだけ有効で、翌日0時に自動で消えます。行ってみて満車だったときは「満車だった」を押すと、60分間は満車として表示されます。</p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
