<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500" role="img" aria-label="ヒグチくん">
  <title>ヒグチくん</title>
  <desc>株式会社西中洲樋口建設 会社キャラクター案A のたたき台</desc>

  <!-- 影 -->
  <ellipse cx="200" cy="466" rx="112" ry="15" fill="#1E3C68" opacity="0.10"/>

  <!-- 左手に持つ図面の筒 -->
  <g transform="rotate(-16 107 378)">
    <rect x="92" y="328" width="30" height="100" rx="15" fill="#FBEFE0" stroke="#1E3C68" stroke-width="5"/>
    <line x1="92" y1="356" x2="122" y2="356" stroke="#1E3C68" stroke-width="5"/>
    <line x1="92" y1="400" x2="122" y2="400" stroke="#1E3C68" stroke-width="5"/>
  </g>

  <!-- 脚 -->
  <rect x="156" y="368" width="36" height="62" rx="18" fill="#22406B"/>
  <rect x="208" y="368" width="36" height="62" rx="18" fill="#22406B"/>
  <!-- 安全靴 -->
  <rect x="142" y="418" width="56" height="30" rx="13" fill="#3A3F46"/>
  <rect x="202" y="418" width="56" height="30" rx="13" fill="#3A3F46"/>

  <!-- 胴（作業着） -->
  <rect x="122" y="252" width="156" height="132" rx="36" fill="#1E3C68"/>
  <!-- 前立て -->
  <rect x="194" y="262" width="12" height="112" rx="6" fill="#16325A"/>
  <!-- 胸ポケット -->
  <rect x="216" y="296" width="42" height="34" rx="8" fill="#16325A"/>
  <!-- 社章バッジ（白い角丸の四角＝社名の「口」＝建物の開口部） -->
  <circle cx="170" cy="312" r="21" fill="#F08300"/>
  <rect x="159" y="301" width="22" height="22" rx="6" fill="none" stroke="#FFFFFF" stroke-width="5"/>

  <!-- 腕（左：下ろして筒を持つ） -->
  <path d="M136 292 Q 110 330 106 366" stroke="#1E3C68" stroke-width="36" stroke-linecap="round" fill="none"/>
  <circle cx="105" cy="376" r="20" fill="#FBEFE0"/>
  <!-- 腕（右：あいさつ） -->
  <path d="M266 292 Q 302 278 314 238" stroke="#1E3C68" stroke-width="36" stroke-linecap="round" fill="none"/>
  <circle cx="317" cy="228" r="21" fill="#FBEFE0"/>

  <!-- 首のタオル -->
  <path d="M150 250 q50 34 100 0 v18 q-50 34 -100 0 z" fill="#FFFFFF"/>

  <!-- 顔（角丸の正方形＝社名の「口」＝建物の開口部） -->
  <rect x="116" y="112" width="168" height="146" rx="38" fill="#FBEFE0"/>

  <!-- ヘルメット -->
  <path d="M104 186 a96 96 0 0 1 192 0 z" fill="#F08300"/>
  <path d="M192 92 h16 a4 4 0 0 1 4 4 v90 h-24 v-90 a4 4 0 0 1 4 -4 z" fill="#FFFFFF" opacity="0.85"/>
  <rect x="90" y="178" width="220" height="22" rx="11" fill="#FF9E2A"/>

  <!-- 目 -->
  <ellipse cx="168" cy="214" rx="9" ry="11.5" fill="#2B2B2B"/>
  <ellipse cx="232" cy="214" rx="9" ry="11.5" fill="#2B2B2B"/>
  <!-- 頬 -->
  <circle cx="141" cy="230" r="11" fill="#F4A6A0" opacity="0.75"/>
  <circle cx="259" cy="230" r="11" fill="#F4A6A0" opacity="0.75"/>
  <!-- 口 -->
  <path d="M182 232 q18 17 36 0" stroke="#2B2B2B" stroke-width="5.5" stroke-linecap="round" fill="none"/>
</svg>
