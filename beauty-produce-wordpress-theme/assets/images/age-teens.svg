<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-label="age-teens">
  <defs>
    <linearGradient id="bg-age-teens" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="hsl(8,55%,93%)"/>
      <stop offset="100%" stop-color="hsl(340,40%,95%)"/>
    </linearGradient>
    <radialGradient id="glow-age-teens" cx="50%" cy="34%" r="52%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloth-age-teens" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="hsl(350,45%,80%)"/>
      <stop offset="100%" stop-color="hsl(350,45%,80%)" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <rect width="800" height="800" fill="url(#bg-age-teens)"/>
  <circle cx="400" cy="300" r="260" fill="url(#glow-age-teens)"/>

  <circle cx="150" cy="150" r="70" fill="hsl(45,60%,70%)" opacity="0.16"/>
  <circle cx="672" cy="216" r="44" fill="hsl(350,45%,80%)" opacity="0.22"/>
  <circle cx="700" cy="640" r="96" fill="hsl(45,60%,70%)" opacity="0.12"/>
  <circle cx="118" cy="612" r="38" fill="hsl(350,45%,80%)" opacity="0.18"/>

  <circle cx="400" cy="292" r="196" fill="none" stroke="hsl(45,60%,70%)" stroke-width="1.5" opacity="0.45"/>

  <!-- shoulders -->
  <path d="M204 800 C 212 636 296 552 400 552 C 504 552 592 636 600 800 Z" fill="url(#cloth-age-teens)"/>
  <path d="M400 552 L 366 640 L 400 700 L 434 640 Z" fill="hsl(340,40%,95%)" opacity="0.65"/>

  <!-- neck -->
  <path d="M362 470 h76 v88 c0 22 -76 22 -76 0 z" fill="hsl(28,48%,88%)"/>
  <path d="M362 470 h76 v34 c-26 20 -50 20 -76 0 z" fill="hsl(22,40%,24%)" opacity="0.12"/>

  <!-- hair back -->
  <path d="M256 316 C 256 176 340 108 400 108 C 460 108 544 176 544 316 C 544 430 528 486 512 520 C 508 452 500 400 486 376 C 452 402 348 402 314 376 C 300 400 292 452 288 520 C 272 486 256 430 256 316 Z" fill="hsl(22,40%,24%)"/>

  <!-- face -->
  <path d="M296 300 C 296 210 340 164 400 164 C 460 164 504 210 504 300 C 504 396 458 470 400 470 C 342 470 296 396 296 300 Z" fill="hsl(28,48%,88%)"/>

  <!-- fringe -->
  <path d="M292 302 C 288 200 336 140 400 140 C 464 140 512 200 508 302 C 494 258 470 232 442 224 C 404 254 340 262 306 250 C 298 262 294 282 292 302 Z" fill="hsl(22,40%,24%)"/>

  <!-- eyes / brows / lips -->
  <path d="M338 296 q 22 -16 44 0" fill="none" stroke="hsl(22,40%,24%)" stroke-width="7" stroke-linecap="round"/>
  <path d="M418 296 q 22 -16 44 0" fill="none" stroke="hsl(22,40%,24%)" stroke-width="7" stroke-linecap="round"/>
  <path d="M336 264 q 24 -14 48 -4" fill="none" stroke="hsl(22,40%,24%)" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M416 260 q 24 -10 48 4" fill="none" stroke="hsl(22,40%,24%)" stroke-width="5" stroke-linecap="round" opacity="0.7"/>
  <path d="M382 386 q 18 14 36 0 q -18 22 -36 0 z" fill="hsl(350,45%,80%)"/>
  <ellipse cx="330" cy="344" rx="20" ry="12" fill="hsl(350,45%,80%)" opacity="0.35"/>
  <ellipse cx="470" cy="344" rx="20" ry="12" fill="hsl(350,45%,80%)" opacity="0.35"/>
</svg>
